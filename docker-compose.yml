services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eyes-ears-backend
    ports:
      - "5001:5001"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 5001
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eyes-ears-notification-worker
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    command: node workers/notification.worker.js

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eyes-ears-notification-scheduler
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    command: node workers/notification.scheduler.js

  redis:
    image: redis:7-alpine
    container_name: eyes-ears-redis